name: Install CI dependencies
description: Install system packages required by CI workflows

inputs:
  profile:
    description: Dependency set to install (golang-container or runner)
    required: false
    default: golang-container

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail

        install_packages() {
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$@"
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache "$@"
          else
            echo "No supported package manager found (expected apt-get or apk)." >&2
            exit 1
          fi
        }

        case "${{ inputs.profile }}" in
          golang-container)
            # golang:*-bookworm is Debian-based but omits make; git/curl are used by
            # the Makefile (go install, envtest, custom golangci-lint) and by Helm scripts.
            install_packages make git curl ca-certificates
            ;;
          runner)
            if ! command -v make >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends make
              elif command -v apk >/dev/null 2>&1; then
                sudo apk add --no-cache make
              else
                echo "make is not installed and no supported package manager was found." >&2
                exit 1
              fi
            fi
            ;;
          *)
            echo "Unknown profile: ${{ inputs.profile }}" >&2
            exit 1
            ;;
        esac
