name: E2E Tests

on:
  pull_request:

concurrency:
  group: test-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIND_CLUSTER: hyperbytedb-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Install CI dependencies
        uses: ./.github/actions/install-ci-deps
        with:
          profile: k8s-runner
          install_kind: "true"
          install_kubectl: "true"

      - name: Run e2e tests
        run: |
          go mod tidy
          make test-e2e KIND_CLUSTER="$KIND_CLUSTER"

      - name: Cleanup kind cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER" || true
