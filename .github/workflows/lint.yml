name: Lint

on:
  push:
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    container:
      image: golang:1.25-bookworm
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
