name: Test Chart

on:
  pull_request:

concurrency:
  group: test-chart-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-chart:
    name: Test Chart
    runs-on: hyperbytedb-operator-controller
    timeout-minutes: 30
    env:
      KIND_CLUSTER_NAME: hyperbytedb-chart-${{ github.run_id }}-${{ github.run_attempt }}
      OPERATOR_IMG: hyperbytedb-operator:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Install CI dependencies
        uses: ./.github/actions/install-ci-deps
        with:
          profile: runner

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -Ls https://dl.k8s.io/release/stable.txt)
          curl -Lo ./kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Create kind cluster
        run: kind create cluster --name "$KIND_CLUSTER_NAME"

      - name: Prepare hyperbytedb-operator
        run: |
          go mod tidy
          make docker-build IMG="$OPERATOR_IMG"
          kind load docker-image "$OPERATOR_IMG" --name "$KIND_CLUSTER_NAME"

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm Chart
        run: helm lint ./dist/chart

      - name: Deploy manager via Helm
        run: make helm-deploy IMG="$OPERATOR_IMG"

      - name: Check Helm release status
        run: make helm-status

      - name: Cleanup kind cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER_NAME" || true
