name: Test Chart

on:
  pull_request:

concurrency:
  group: test-chart-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-chart:
    name: Test Chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIND_CLUSTER_NAME: hyperbytedb-chart-${{ github.run_id }}-${{ github.run_attempt }}
      OPERATOR_IMG: hyperbytedb-operator:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Install CI dependencies
        uses: ./.github/actions/install-ci-deps
        with:
          profile: k8s-runner
          install_kind: "true"
          install_kubectl: "true"
          install_helm: "true"

      - name: Create kind cluster
        run: kind create cluster --name "$KIND_CLUSTER_NAME"

      - name: Prepare hyperbytedb-operator
        run: |
          go mod tidy
          make docker-build IMG="$OPERATOR_IMG"
          kind load docker-image "$OPERATOR_IMG" --name "$KIND_CLUSTER_NAME"

      - name: Lint Helm Chart
        run: helm lint ./dist/chart

      - name: Deploy manager via Helm
        run: make helm-deploy IMG="$OPERATOR_IMG"

      - name: Check Helm release status
        run: make helm-status

      - name: Cleanup kind cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER_NAME" || true
