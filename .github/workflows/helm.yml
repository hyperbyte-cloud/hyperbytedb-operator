name: Helm

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  helm:
    name: Package & Push
    runs-on: self-hosted
    container:
      image: debian:bookworm-slim
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git

      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set chart version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-sha.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package chart
        run: helm package dist/chart --version "${{ steps.version.outputs.version }}" --app-version "${{ steps.version.outputs.version }}"

      - name: Push chart
        run: helm push hyperbytedb-operator-*.tgz oci://ghcr.io/hyperbyte-cloud
