name: Tests

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: self-hosted
    container:
      image: golang:1.25-bookworm
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Running Tests
        run: |
          go mod tidy
          make test
