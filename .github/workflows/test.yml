name: Tests

on:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: golang:1.25-bookworm
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      # Required so that `go list`/`go test` can run `git` for VCS stamping
      # inside the container without hitting "dubious ownership" errors.
      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Running Tests
        run: |
          go mod tidy
          make test
