## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  replicas: 1

  image:
    repository: ghcr.io/hyperbyte-cloud/hyperbytedb-operator
    # Leave empty to track the chart's appVersion (recommended). Override to
      # pin to a specific tag, e.g. tag: "0.2.0".
    tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Environment variables
  ##
  env:
    - name: ENABLE_WEBHOOKS
      value: "false"

  ## Env overrides (--set manager.envOverrides.VAR=value)
  ## Same name in env above: this value takes precedence.
  ##
  envOverrides: {}

  ## Image pull secrets
  ##
  imagePullSecrets: []

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

## Helper RBAC roles for managing custom resources
##
rbacHelpers:
  # Install convenience admin/editor/viewer roles for CRDs
  enable: false

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enable: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint with RBAC protection.
##
metrics:
  enable: true
  # Metrics server port
  port: 8443

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enable: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enable: false

## Ingress for the operator metrics endpoint.
## Disabled by default. Enable to expose /metrics externally.
##
ingress:
  enabled: false
  ingressClassName: nginx
  annotations: {}
  hosts:
    - host: operator.local
      paths:
        - path: /metrics
          pathType: Prefix
  tls: []
  # tls:
  #   - hosts:
  #     - operator.local
  #     secretName: operator-tls

## Gateway API resources for the operator metrics endpoint.
## Disabled by default. Requires Gateway API CRDs in the cluster.
##
gateway:
  enabled: false
  ## Provision a Gateway resource.
  ## Set to null or omit to use an existing Gateway (reference it via HTTPRoute parentRefs instead).
  gateway: null
  # gateway:
  #   gatewayClassName: istio
  #   annotations: {}
  #   listeners:
  #     - name: https
  #       port: 443
  #       protocol: HTTPS
  #       hostname: operator.local
  #       tls:
  #         mode: Terminate
  #         certificateRefs:
  #           - name: operator-tls

  ## HTTPRoute resources attaching to a Gateway.
  ## Each entry creates a separate HTTPRoute.
  httpRoutes: []
