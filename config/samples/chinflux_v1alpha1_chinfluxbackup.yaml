apiVersion: chinflux.chinflux.io/v1alpha1
kind: ChinfluxBackup
metadata:
  name: chinflux-daily-backup
  namespace: default
spec:
  clusterName: chinflux-cluster
  schedule: "0 2 * * *"
  destination:
    s3:
      bucket: chinflux-backups
      prefix: "daily/"
      region: us-east-1
      credentialsSecretName: s3-backup-credentials
  retentionDays: 7
  backupType: full
  # databases: []  # Empty means all databases
