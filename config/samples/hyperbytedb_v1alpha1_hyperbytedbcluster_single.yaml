apiVersion: hyperbytedb.hyperbyte.cloud/v1alpha1
kind: HyperbytedbCluster
metadata:
  name: hyperbytedb-single
  namespace: default
spec:
  replicas: 1
  image: hyperbytedb:latest
  version: "1.0.0"
  server:
    port: 8086
  storage:
    volumeClaimTemplate:
      size: 5Gi
  flush:
    intervalSecs: 10
  retention:
    enabled: true
    interval: 60s
  logging:
    level: info
    format: text
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  monitoring:
    enabled: true
    serviceMonitor: false
  failover:
    enabled: false
