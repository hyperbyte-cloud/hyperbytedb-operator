apiVersion: chinflux.chinflux.io/v1alpha1
kind: ChinfluxRestore
metadata:
  name: chinflux-restore-latest
  namespace: default
spec:
  clusterName: chinflux-cluster
  backupName: chinflux-daily-backup
  # source is resolved automatically from the backup CR above.
  # Override by specifying source.s3 explicitly:
  # source:
  #   s3:
  #     bucket: chinflux-backups
  #     prefix: "daily/20260301-020000/"
  #     region: us-east-1
  #     credentialsSecretName: s3-backup-credentials
