---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-hyperbytedb-hyperbytedb-io-v1alpha1-hyperbytedbcluster
  failurePolicy: Fail
  name: mhyperbytedbcluster.kb.io
  rules:
  - apiGroups:
    - hyperbytedb.hyperbyte.cloud
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - hyperbytedbclusters
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-hyperbytedb-hyperbytedb-io-v1alpha1-hyperbytedbcluster
  failurePolicy: Fail
  name: vhyperbytedbcluster.kb.io
  rules:
  - apiGroups:
    - hyperbytedb.hyperbyte.cloud
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - hyperbytedbclusters
  sideEffects: None
