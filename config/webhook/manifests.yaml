---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-chinflux-chinflux-io-v1alpha1-chinfluxcluster
  failurePolicy: Fail
  name: mchinfluxcluster.kb.io
  rules:
  - apiGroups:
    - chinflux.chinflux.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - chinfluxclusters
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-chinflux-chinflux-io-v1alpha1-chinfluxcluster
  failurePolicy: Fail
  name: vchinfluxcluster.kb.io
  rules:
  - apiGroups:
    - chinflux.chinflux.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - chinfluxclusters
  sideEffects: None
