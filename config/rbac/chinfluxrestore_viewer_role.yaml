# This rule is not used by the project chinflux-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to chinflux.chinflux.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: chinflux-operator
    app.kubernetes.io/managed-by: kustomize
  name: chinfluxrestore-viewer-role
rules:
- apiGroups:
  - chinflux.chinflux.io
  resources:
  - chinfluxrestores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - chinflux.chinflux.io
  resources:
  - chinfluxrestores/status
  verbs:
  - get
